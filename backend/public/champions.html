<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legends — Rift Ranked</title>
<style>
  :root{--bg:#0a0f1c;--panel:#0e1728;--line:rgba(200,170,110,.18);--gold:#c8aa6e;--gold2:#e4c877;
    --ink:#eef1f6;--dim:#8b94a3;--good:#7fc47a;--bad:#d1706c}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -15%,#16233f,#070b14);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 16px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .title{font-size:24px;font-weight:800;letter-spacing:.3px}
  .title b{color:var(--gold)}
  .sp{flex:1}
  a.nav{color:#7e6a3e;text-decoration:none;font-weight:700;font-size:13px}
  a.nav:hover{color:var(--gold)}
  .seg{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:8px;padding:3px}
  .seg button{cursor:pointer;background:0;border:0;color:var(--dim);font-weight:700;font-size:13px;padding:6px 14px;border-radius:6px}
  .seg button.on{color:#0b0f16;background:linear-gradient(180deg,var(--gold2),var(--gold))}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .champ{background:linear-gradient(180deg,var(--panel),#0b1220);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
  .champ:hover{border-color:rgba(200,170,110,.4);transform:translateY(-2px)}
  .art{position:relative;aspect-ratio:3/4;background:#0b1220 center/cover no-repeat;overflow:hidden}
  .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(8,12,22,.92))}
  .art .wr{position:absolute;top:8px;right:8px;z-index:2;font-weight:800;font-size:13px;padding:3px 8px;border-radius:999px;
    background:rgba(8,12,22,.72);border:1px solid rgba(255,255,255,.12)}
  .art .wr.good{color:var(--good)} .art .wr.bad{color:var(--bad)}
  .art .nm{position:absolute;left:10px;right:10px;bottom:8px;z-index:2}
  .art .nm .b{font-size:17px;font-weight:800;line-height:1.1;text-shadow:0 2px 6px #000}
  .art .nm .s{font-size:11px;color:#c9d2df;opacity:.85;margin-top:2px}
  .meta{padding:10px 12px 12px}
  .bar{height:6px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;margin-bottom:8px}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b98f3e,var(--gold2))}
  .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .row .g{color:var(--ink);font-weight:700} .row .wl .w{color:var(--good)} .row .wl .l{color:var(--bad)}
  .row .pr{margin-left:auto}
  .state{text-align:center;color:var(--dim);padding:60px 0;font-size:15px}
  .note{color:var(--dim);font-size:12.5px;margin:14px 2px 0}
  .champ{cursor:pointer}
  /* modal de confrontos */
  #detail{display:none;position:fixed;inset:0;z-index:50;place-items:center;background:rgba(6,9,16,.74);backdrop-filter:blur(3px);padding:16px}
  .dcard{width:460px;max-width:94vw;max-height:84vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel),#0b1220);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .dart{width:42px;height:56px;object-fit:cover;border-radius:7px;border:1px solid rgba(200,170,110,.25);flex:none}
  .dt{font-size:18px;font-weight:800} .ds{font-size:12px;color:var(--dim)}
  .dx{margin-left:auto;cursor:pointer;background:0;border:0;color:var(--dim);font-size:18px;padding:4px 8px;border-radius:6px}
  .dx:hover{color:#fff;background:rgba(255,255,255,.06)}
  .dbody{padding:10px 14px 14px;overflow:auto}
  .mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .mi{width:28px;height:38px;object-fit:cover;border-radius:5px;border:1px solid rgba(200,170,110,.2);flex:none;background:#0b1220}
  .mn{font-weight:700;font-size:13px;min-width:90px}
  .mn .mirror{color:var(--dim);font-weight:400;font-size:11px}
  .mbar{flex:1;height:6px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden}
  .mbar>i{display:block;height:100%;border-radius:999px} .mbar>i.good{background:#4f9d57} .mbar>i.bad{background:#a44b47}
  .mw{font-weight:800;font-size:13px;width:42px;text-align:right;font-variant-numeric:tabular-nums}
  .mr{font-size:12px;color:var(--dim);width:60px;text-align:right;font-variant-numeric:tabular-nums}
  .mw.good,.mn .good{color:var(--good)} .mw.bad{color:var(--bad)}
  .mempty{color:var(--dim);text-align:center;padding:20px 0}
</style></head>
<body><div class="wrap">
  <header>
    <div class="title"><b>Legends</b> · Rift Ranked</div>
    <div class="sp"></div>
    <div class="seg" id="seg"><button data-f="bo1" class="on">Md1</button><button data-f="bo3">Md3</button></div>
    <a class="nav" href="/ranked">← Ladder</a>
  </header>
  <div id="app"><div class="state">Carregando…</div></div>
  <div class="note" id="note"></div>
</div>
<div id="detail"></div>
<script>
  const app = document.getElementById("app");
  const note = document.getElementById("note");
  let fmt = "bo1";
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cardImg = (code) => code ? `https://assets.riftatlas-workers.com/cdn-cgi/image/width=320,quality=75,format=auto,fit=scale-down/riftbound/cards/small-v2/${encodeURIComponent(code)}.webp` : "";
  const champName = (legendName) => (legendName||"").split(",")[0].trim() || "?";

  function tile(c, total){
    const wr = c.winrate >= 50 ? "good" : "bad";
    const pick = total ? Math.round((c.games/total)*100) : 0;
    const art = cardImg(c.legendCode || c.championCode);
    return `<div class="champ" data-code="${c.legendCode || ""}" data-name="${esc(champName(c.legendName))}" title="Ver confrontos">
      <div class="art" style="background-image:url('${art}')">
        <span class="wr ${wr}">${c.winrate}%</span>
        <div class="nm"><div class="b">${esc(champName(c.legendName))}</div><div class="s">${esc(c.legendName||"")}</div></div>
      </div>
      <div class="meta">
        <div class="bar"><i style="width:${Math.max(0,Math.min(100,c.winrate))}%"></i></div>
        <div class="row"><span class="g">${c.games}</span> jogos <span class="wl">· <span class="w">${c.wins}V</span> <span class="l">${c.losses}D</span></span><span class="pr">${pick}% uso</span></div>
      </div>
    </div>`;
  }

  let MU = {}; // mapa aCode -> [{bCode,bName,games,aWins,aLosses,winrate}]
  async function load(){
    app.innerHTML = `<div class="state">Carregando…</div>`;
    note.textContent = "";
    let data, mud;
    try {
      [data, mud] = await Promise.all([
        fetch(`/ranked/api/champions?format=${fmt}&_=${Date.now()}`).then(r=>r.json()),
        fetch(`/ranked/api/matchups?format=${fmt}&_=${Date.now()}`).then(r=>r.json()),
      ]);
    } catch { app.innerHTML = `<div class="state">Erro ao carregar.</div>`; return; }
    MU = {};
    for (const r of (mud.matchups || [])) { (MU[r.aCode] = MU[r.aCode] || []).push(r); }
    const champs = data.champions || [];
    if (!champs.length){ app.innerHTML = `<div class="state">Ainda não há partidas registradas com Legend neste formato.<br>Jogue partidas ranqueadas (extensão 0.3.24+) para popular as estatísticas.</div>`; return; }
    app.innerHTML = `<div class="grid">${champs.map((c)=>tile(c, data.totalGames)).join("")}</div>`;
    note.textContent = `${champs.length} Legends · ${data.totalGames} aparições registradas (${fmt.toUpperCase()}). Clique num Legend para ver os confrontos.`;
  }

  // ---- detalhe de confrontos (Legend vs Legend geral) ----
  function showMatchups(code, name){
    const list = (MU[code] || []).slice().sort((a,b)=>b.games-a.games);
    const rows = list.length ? list.map((r)=>{
      const wr = r.winrate >= 50 ? "good" : "bad";
      const mirror = r.bCode === code ? ' <span class="mirror">(espelho)</span>' : "";
      return `<div class="mrow">
        <img class="mi" src="${cardImg(r.bCode)}" alt="">
        <span class="mn">${esc(champName(r.bName))}${mirror}</span>
        <span class="mbar"><i class="${wr}" style="width:${Math.max(0,Math.min(100,r.winrate))}%"></i></span>
        <span class="mw ${wr}">${r.winrate}%</span>
        <span class="mr">${r.aWins}V ${r.aLosses}D</span>
      </div>`;
    }).join("") : `<div class="mempty">Sem confrontos registrados ainda.</div>`;
    document.getElementById("detail").innerHTML = `
      <div class="dcard">
        <div class="dhead"><img class="dart" src="${cardImg(code)}" alt=""><div><div class="dt">${esc(name)}</div><div class="ds">confrontos (${fmt.toUpperCase()})</div></div><button class="dx" id="dx">✕</button></div>
        <div class="dbody">${rows}</div>
      </div>`;
    document.getElementById("detail").style.display = "grid";
    document.getElementById("dx").onclick = closeDetail;
  }
  function closeDetail(){ const d=document.getElementById("detail"); d.style.display="none"; d.innerHTML=""; }
  app.addEventListener("click",(e)=>{ const c=e.target.closest(".champ"); if(c && c.dataset.code){ showMatchups(c.dataset.code, c.dataset.name); } });
  document.getElementById("detail").addEventListener("click",(e)=>{ if(e.target.id==="detail") closeDetail(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeDetail(); });
  document.getElementById("seg").addEventListener("click",(e)=>{
    const b = e.target.closest("button"); if(!b) return;
    fmt = b.dataset.f;
    document.querySelectorAll("#seg button").forEach((x)=>x.classList.toggle("on",x===b));
    load();
  });
  load();
</script>
</body></html>
