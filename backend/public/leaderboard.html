<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rift Ranked — Ladder</title>
  <style>
    :root {
      --bg: #0a0e16; --bg2: #0c1220; --panel: #10172485; --row: #0e1522;
      --line: rgba(197,170,110,.16); --line2: rgba(255,255,255,.055);
      --gold: #c8aa6e; --gold-d: #7a5f30; --steel: #5c7791;
      --txt: #e4e3dc; --dim: #8b94a3; --muted: #5b6676; --win: #74b56a; --loss: #c0615d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--txt);
      font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .nums { font-variant-numeric: tabular-nums; }
    .topbar { border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #0c1322, var(--bg)); }
    .topbar .inner { max-width: 940px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand .mk { width: 30px; height: 30px; display: grid; place-items: center; }
    .brand .wordmark { line-height: 1; }
    .brand .wordmark .a { font-weight: 800; letter-spacing: 3px; font-size: 12px; color: var(--gold); }
    .brand .wordmark .b { font-weight: 700; letter-spacing: 1px; font-size: 15px; margin-top: 3px; }
    .topbar .spacer { flex: 1; }
    .season { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .lang { display: flex; gap: 3px; margin-left: 16px; }
    .lang button { cursor: pointer; background: 0; border: 0; color: var(--muted); font-size: 11px; font-weight: 700; padding: 3px 5px; border-radius: 4px; letter-spacing: .3px; }
    .lang button.on { color: var(--gold); background: rgba(197,170,110,.1); }
    .wrap { max-width: 940px; margin: 0 auto; padding: 22px 20px 70px; }
    .controls { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 26px; }
    .tabs button { cursor: pointer; background: 0; border: 0; padding: 0 0 10px; color: var(--dim);
      font-weight: 700; font-size: 14px; letter-spacing: .3px; border-bottom: 2px solid transparent; }
    .tabs button.active { color: var(--txt); border-color: var(--gold); }
    .count { font-size: 12px; color: var(--muted); }
    .count b { color: var(--dim); }
    .board { border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--bg2); }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); font-weight: 700; padding: 11px 16px; background: #0b1120; border-bottom: 1px solid var(--line2); }
    th.r, td.r { text-align: right; }
    tbody td { padding: 10px 16px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,.015); }
    tbody tr:hover { background: rgba(197,170,110,.05); }
    tbody tr.r1 td { box-shadow: inset 2px 0 0 var(--gold); }
    tbody tr.r2 td { box-shadow: inset 2px 0 0 #9fb0c0; }
    tbody tr.r3 td { box-shadow: inset 2px 0 0 #b07d4a; }
    .rk { width: 40px; color: var(--muted); font-weight: 700; }
    .rk.g1 { color: var(--gold); } .rk.g2 { color: #b9c3cf; } .rk.g3 { color: #c2894f; }
    .tier { display: flex; align-items: center; gap: 11px; }
    .tier .meta { line-height: 1.25; }
    .tier .tn { font-weight: 650; font-size: 13.5px; }
    .tier .lp { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
    .tier .lp .bar { width: 54px; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
    .tier .lp .bar > i { display: block; height: 100%; }
    .tier .lp .t { font-size: 11px; color: var(--muted); }
    .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .av { width: 26px; height: 26px; border-radius: 5px; flex: none; display: grid; place-items: center;
      font-weight: 700; font-size: 12px; color: #0b0f16; }
    .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lnk { display: block; text-decoration: none; color: inherit; }
    tbody tr:hover .nm { color: var(--gold); }
    .tag { font-size: 9px; letter-spacing: .5px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px;
      padding: 1px 4px; margin-left: 7px; vertical-align: middle; text-transform: uppercase; }
    .idt { font-size: 10px; font-weight: 600; color: var(--dim); margin-left: 6px; letter-spacing: .3px;
      font-variant-numeric: tabular-nums; vertical-align: middle; }
    .wl { color: var(--dim); }
    .wr b { font-weight: 700; } .wr.good b { color: var(--win); } .wr.bad b { color: var(--loss); }
    .mmr { color: var(--dim); font-weight: 600; }
    .state { text-align: center; color: var(--dim); padding: 52px 18px; }
    .state .h { color: var(--txt); font-weight: 600; margin-bottom: 4px; }
    .foot { margin-top: 16px; font-size: 11.5px; color: var(--muted); letter-spacing: .2px; }
    /* Mobile: a tabela vira lista flex (evita o overflow do table-layout automático). */
    @media (max-width: 640px) {
      .topbar .inner { flex-wrap: wrap; gap: 6px 12px; padding: 12px 14px; }
      .brand { flex: 1 1 100%; }
      .season { display: none; }
      .lang { margin-left: auto; }
      .wrap { padding: 16px 12px 60px; }
      .controls { margin-bottom: 10px; }
      .tabs { gap: 18px; }
      thead { display: none; }
      table, tbody, tr, td { display: block; }
      tbody tr { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border-bottom: 1px solid var(--line2); }
      tbody tr:last-child { border-bottom: 0; }
      tbody tr.r1 { border-left: 3px solid var(--gold); }
      tbody tr.r2 { border-left: 3px solid #9fb0c0; }
      tbody tr.r3 { border-left: 3px solid #b07d4a; }
      tbody td { padding: 0 !important; border: 0 !important; box-shadow: none !important; }
      tbody td.rk { width: 18px; flex: none; text-align: center; }
      tbody td:nth-child(2) { flex: none; }
      tbody td:nth-child(3) { flex: 1 1 auto; min-width: 0; }
      tbody td:nth-child(5) { flex: none; margin-left: auto; }
      tbody td:nth-child(6) { flex: none; min-width: 40px; text-align: right; }
      .tier { gap: 8px; }
      .tier .meta .lp { display: none; }
      .tier .tn { font-size: 12px; max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who .av { width: 24px; height: 24px; font-size: 11px; }
      .nm { font-size: 12.5px; }
      .tag, .idt { display: none; }
    }
    @media (max-width: 330px) { th#h-wr, td.wr { display: none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <div class="mk">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 1.6l9 5.2v10.4L12 22.4 3 17.2V6.8L12 1.6z" stroke="#c8aa6e" stroke-width="1.3" stroke-linejoin="round"/><path d="M12 6.4l5 2.9v5.4L12 17.6l-5-2.9V9.3L12 6.4z" fill="#c8aa6e" fill-opacity=".16" stroke="#c8aa6e" stroke-opacity=".5" stroke-width="1"/></svg>
        </div>
        <div class="wordmark"><div class="a">RIFT RANKED</div><div class="b" id="brandB">Ladder Ranqueado</div></div>
      </div>
      <div class="spacer"></div>
      <a href="/ranked/legends" style="color:#c8aa6e;text-decoration:none;font-weight:700;font-size:13px;margin-right:14px">🏆 Legends</a>
      <div class="live" id="rk-live" style="display:none;align-items:center;gap:7px;margin-right:14px;font-size:12.5px;font-weight:700;color:#9fb0c0">
        <span style="width:7px;height:7px;border-radius:50%;background:#51c15a;box-shadow:0 0 7px rgba(81,193,90,.6)"></span>
        <span id="rk-live-txt"></span>
      </div>
      <div class="season" id="season">Temporada 1 · Constructed</div>
      <div class="lang" id="lang"></div>
    </div>
  </div>
  <script>
    (function(){
      var el=document.getElementById("rk-live"), txt=document.getElementById("rk-live-txt");
      function fmt(s){ var p=[s.online+" online"]; var m=s.activeMatches||0; if(m>0) p.push(m+(m===1?" em partida":" em partidas")); return p.join(" · "); }
      async function tick(){
        try{ var r=await fetch("/ranked/api/stats?_="+Date.now()); var s=await r.json();
          if(typeof s.online==="number"){ txt.textContent=fmt(s); el.style.display="flex"; } }
        catch(e){ /* silencioso */ }
      }
      tick(); setInterval(tick, 20000);
    })();
  </script>

  <div class="wrap">
    <div class="controls">
      <div class="tabs">
        <button data-fmt="bo1" class="active" id="tab1">Melhor de 1</button>
        <button data-fmt="bo3" id="tab3">Melhor de 3</button>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="board">
      <table>
        <thead>
          <tr>
            <th class="rk">#</th>
            <th id="h-tier">Elo</th>
            <th id="h-player">Invocador</th>
            <th class="r hide-sm" id="h-vd">V&nbsp;–&nbsp;D</th>
            <th class="r" id="h-wr">Vitórias</th>
            <th class="r">MMR</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="state">…</td></tr></tbody>
      </table>
    </div>
    <div class="foot" id="foot"></div>
  </div>

  <script>
    // ----------------------------- i18n -----------------------------
    const L = {
      pt: { docTitle: "Rift Ranked — Ladder", brandB: "Ladder Ranqueado", season: "Temporada 1 · Constructed",
        tab1: "Melhor de 1", tab3: "Melhor de 3", hTier: "Elo", hPlayer: "Invocador", hVd: "V – D", hWr: "Vitórias",
        count: (r, t) => `<b>${r}</b> classificados · <b>${t}</b> no total`, loading: "Carregando o ladder…",
        emptyH: "Ladder ainda vazio", emptyB: "Jogue partidas ranqueadas para abrir a temporada.",
        loadFail: "Não foi possível carregar o ladder.", notRanked: "Não classificado",
        placementTag: "colocação", lp: (n) => `${n} LP`, placeLeft: (n) => `${n} colocação${n > 1 ? "s" : ""} restante${n > 1 ? "s" : ""}`,
        foot: "Entra no ladder após 5 partidas de colocação. Rating recalculado ao fim de cada partida (Glicko-2).",
        tiers: ["Bronze", "Prata", "Ouro", "Platina", "Esmeralda", "Diamante", "Mestre", "Grão-Mestre", "Desafiante"] },
      en: { docTitle: "Rift Ranked — Ladder", brandB: "Ranked Ladder", season: "Season 1 · Constructed",
        tab1: "Best of 1", tab3: "Best of 3", hTier: "Rank", hPlayer: "Summoner", hVd: "W – L", hWr: "Win rate",
        count: (r, t) => `<b>${r}</b> ranked · <b>${t}</b> total`, loading: "Loading the ladder…",
        emptyH: "Ladder is empty", emptyB: "Play ranked games to open the season.",
        loadFail: "Couldn't load the ladder.", notRanked: "Unranked",
        placementTag: "placement", lp: (n) => `${n} LP`, placeLeft: (n) => `${n} placement${n > 1 ? "s" : ""} left`,
        foot: "You enter the ladder after 5 placement games. Rating is recomputed after each match (Glicko-2).",
        tiers: ["Bronze", "Silver", "Gold", "Platinum", "Emerald", "Diamond", "Master", "Grandmaster", "Challenger"] },
      zh: { docTitle: "Rift Ranked — 排位天梯", brandB: "排位天梯", season: "第 1 赛季 · Constructed",
        tab1: "单局 BO1", tab3: "三局 BO3", hTier: "段位", hPlayer: "召唤师", hVd: "胜 – 负", hWr: "胜率",
        count: (r, t) => `<b>${r}</b> 已定级 · 共 <b>${t}</b> 人`, loading: "加载天梯中…",
        emptyH: "天梯暂无数据", emptyB: "进行排位对局即可开启赛季。",
        loadFail: "无法加载天梯。", notRanked: "未定级",
        placementTag: "定级", lp: (n) => `${n} LP`, placeLeft: (n) => `还需 ${n} 场定级赛`,
        foot: "完成 5 场定级赛后进入天梯。每场对局结束后重新计算分数（Glicko-2）。",
        tiers: ["黑铁", "白银", "黄金", "铂金", "翡翠", "钻石", "大师", "宗师", "王者"] },
    };
    function detectLang() {
      const q = new URLSearchParams(location.search).get("lang");
      if (q && L[q]) return q;
      try { const s = localStorage.getItem("ranked_lang"); if (s && L[s]) return s; } catch {}
      const n = (navigator.language || "en").toLowerCase();
      return n.startsWith("pt") ? "pt" : n.startsWith("zh") ? "zh" : "en";
    }
    let lang = detectLang();
    const t = () => L[lang];

    const DEMO = new URLSearchParams(location.search).has("demo");
    let fmt = new URLSearchParams(location.search).get("format") === "bo3" ? "bo3" : "bo1";

    const TIERS = [[1000, "#9d6b3f"], [1200, "#9aa7b4"], [1400, "#d2a43c"], [1600, "#3f9d9f"],
      [1800, "#3f9d63"], [2000, "#5a88c4"], [2200, "#8e63c0"], [2350, "#c25049"], [2500, "#caa94f"]];
    const ROMAN = ["IV", "III", "II", "I"];
    function rankFor(rating, games) {
      if (games < 5) return { status: "unranked", need: 5 - games };
      let i = 0; TIERS.forEach((x, k) => { if (rating >= x[0]) i = k; });
      const apex = i >= 6;
      if (apex) return { status: "ranked", i, color: TIERS[i][1], division: null, lp: Math.max(0, Math.round(rating - TIERS[i][0])) };
      const band = (TIERS[i + 1][0] - TIERS[i][0]) / 4, d = Math.min(3, Math.floor((rating - TIERS[i][0]) / band));
      return { status: "ranked", i, color: TIERS[i][1], division: ROMAN[d], lp: Math.min(100, Math.max(0, Math.round(((rating - TIERS[i][0]) - d * band) / band * 100))) };
    }
    function shade(hex, p) { const n = parseInt(hex.slice(1), 16); let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; const to = p < 0 ? 0 : 255, a = Math.abs(p); r = Math.round((to - r) * a + r); g = Math.round((to - g) * a + g); b = Math.round((to - b) * a + b); return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
    let _g = 0;
    function emblem(rk, size) {
      size = size || 32; const gray = rk.status === "unranked"; const color = gray ? "#4a5663" : rk.color;
      const apex = rk.status === "ranked" && !rk.division; const id = "g" + _g++;
      return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true" style="display:block">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(color, .3)}"/><stop offset="1" stop-color="${shade(color, -.45)}"/></linearGradient></defs>
        <path d="M20 2.5 L35 9.5 V23 C35 31 28 34.5 20 37.5 C12 34.5 5 31 5 23 V9.5 Z" fill="url(#${id})" stroke="${shade(color, .35)}" stroke-width="1.3"/>
        <path d="M20 2.5 L35 9.5 V15 C28 11.5 12 11.5 5 15 V9.5 Z" fill="#fff" fill-opacity="${gray ? .05 : .13}"/>
        ${apex ? `<circle cx="20" cy="21" r="4.3" fill="#fff" fill-opacity=".9"/>` : (!gray && rk.division) ? `<text x="20" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#10131a" font-family="ui-sans-serif,system-ui,sans-serif">${rk.division}</text>` : ""}
      </svg>`;
    }
    function tierName(rk) { return rk.status === "unranked" ? t().notRanked : (rk.division ? `${t().tiers[rk.i]} ${rk.division}` : t().tiers[rk.i]); }
    function lpCell(rk) {
      if (rk.status === "unranked") return `<span class="t">${t().placeLeft(rk.need)}</span>`;
      if (!rk.division) return `<span class="t">${t().lp(rk.lp)}</span>`;
      return `<span class="bar"><i style="width:${rk.lp}%;background:${rk.color}"></i></span><span class="t">${t().lp(rk.lp)}</span>`;
    }
    const AVC = ["#5a88c4", "#8e63c0", "#c0615d", "#74b56a", "#c8aa6e", "#4f9aa0", "#b07d4a"];
    function avatar(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `<span class="av" style="background:${AVC[h % AVC.length]}">${esc((name[0] || "?").toUpperCase())}</span>`; }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    function row(p) {
      const rc = p.position <= 3 ? "r" + p.position : "", gc = p.position <= 3 ? "g" + p.position : "";
      const wr = p.winrate >= 50 ? "good" : "bad";
      const tag = p.provisional ? `<span class="tag">${t().placementTag}</span>` : "";
      // identificador único abreviado (derivado do ID da conta/jogador) — diferencia nomes iguais
      const idTag = p.playerId ? `<span class="idt">#${String(p.playerId).replace(/[^0-9a-f]/gi, "").slice(0, 4).toUpperCase()}</span>` : "";
      const rk = rankFor(p.rating, p.games);
      const who = `<div class="who">${avatar(p.displayName)}<span class="nm">${esc(p.displayName)}${idTag}${tag}</span></div>`;
      const cell = p.playerId ? `<a class="lnk" href="/ranked/jogador?id=${encodeURIComponent(p.playerId)}&format=${fmt}">${who}</a>` : who;
      return `<tr class="${rc}">
        <td class="rk ${gc} nums">${p.position}</td>
        <td><div class="tier">${emblem(rk)}<div class="meta"><div class="tn">${tierName(rk)}</div><div class="lp">${lpCell(rk)}</div></div></div></td>
        <td>${cell}</td>
        <td class="r hide-sm nums"><span class="wl">${p.wins}&nbsp;–&nbsp;${p.losses}</span></td>
        <td class="r nums wr ${wr}">${p.games ? "<b>" + p.winrate + "%</b>" : "—"}</td>
        <td class="r nums mmr">${p.rating}</td>
      </tr>`;
    }
    function demoData() {
      const names = ["Faceless", "Nocturne", "vÆ", "SkarnerDiff", "oldmate", "Hwei Enjoyer", "k1ng", "Praxis", "Momento", "lowelo andy", "Tavern", "Qu1ver", "Seraphine", "noah", "Grifo", "Last Whisper", "Tilt Proof", "mid or feed", "Azir Main", "Winterborn", "cr1t", "jg gap", "placements", "smurf"];
      const ratings = [2730, 2520, 2390, 2255, 2155, 2065, 1975, 1895, 1815, 1745, 1675, 1605, 1550, 1505, 1455, 1405, 1355, 1285, 1215, 1145, 1075, 1008, 1500, 1500];
      return ratings.map((r, i) => {
        const wins = Math.max(0, Math.round((r - 980) / 22) + (i % 4)), losses = Math.max(1, Math.round((2800 - r) / 30) + (i % 3));
        const games = i >= 22 ? 3 : wins + losses, tot = wins + losses;
        return { displayName: names[i], rating: r, games, wins, losses, winrate: tot ? Math.round(wins / tot * 100) : 0, provisional: games < 10 };
      }).sort((a, b) => b.rating - a.rating).map((p, i) => ({ ...p, position: i + 1 }));
    }

    async function load() {
      const tb = document.getElementById("rows");
      tb.innerHTML = `<tr><td colspan="6" class="state">${t().loading}</td></tr>`;
      let players = [];
      try { players = DEMO ? demoData() : (((await (await fetch(`/ranked/api/leaderboard?format=${fmt}&limit=100`)).json()).players) || []); }
      catch { tb.innerHTML = `<tr><td colspan="6" class="state">${t().loadFail}</td></tr>`; document.getElementById("count").textContent = ""; return; }
      const ranked = players.filter(p => !p.provisional).length;
      document.getElementById("count").innerHTML = players.length ? t().count(ranked, players.length) : "";
      if (!players.length) { tb.innerHTML = `<tr><td colspan="6" class="state"><div class="h">${t().emptyH}</div>${t().emptyB}</td></tr>`; return; }
      tb.innerHTML = players.map(row).join("");
    }

    function applyStatic() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : lang === "en" ? "en" : "pt-BR";
      document.title = t().docTitle;
      document.getElementById("brandB").textContent = t().brandB;
      document.getElementById("season").textContent = t().season;
      document.getElementById("tab1").textContent = t().tab1;
      document.getElementById("tab3").textContent = t().tab3;
      document.getElementById("h-tier").textContent = t().hTier;
      document.getElementById("h-player").textContent = t().hPlayer;
      document.getElementById("h-vd").innerHTML = t().hVd;
      document.getElementById("h-wr").textContent = t().hWr;
      document.getElementById("foot").textContent = t().foot;
      document.getElementById("lang").innerHTML = ["pt", "en", "zh"].map(l =>
        `<button data-l="${l}" class="${l === lang ? "on" : ""}">${l === "zh" ? "中" : l.toUpperCase()}</button>`).join("");
      document.querySelectorAll("#lang button").forEach(b => b.addEventListener("click", () => {
        lang = b.dataset.l; try { localStorage.setItem("ranked_lang", lang); } catch {}
        applyStatic(); load();
      }));
    }

    document.querySelectorAll(".tabs button").forEach(b =>
      b.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
        b.classList.add("active"); fmt = b.dataset.fmt; load();
      }));
    applyStatic(); load();
  </script>
</body>
</html>
